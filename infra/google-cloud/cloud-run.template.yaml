apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ${SERVICE}
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '${MIN_INSTANCES}'
        autoscaling.knative.dev/maxScale: '${MAX_INSTANCES}'
        run.googleapis.com/startup-cpu-boost: 'true'
    spec:
      serviceAccountName: ${RUNTIME_SERVICE_ACCOUNT}
      containerConcurrency: 4
      timeoutSeconds: 300
      containers:
        - image: ${IMAGE_DIGEST}
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: '1'
              memory: 1Gi
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: '${ASPNETCORE_ENVIRONMENT}'
            - name: Swagger__Enabled
              value: 'true'
            - name: AI__Provider
              value: Vertex
            - name: AI__Google__AuthMode
              value: Adc
            - name: AI__Google__ProjectId
              value: '${PROJECT_ID}'
            - name: AI__Google__Location
              value: global
            - name: AI__Google__Model
              value: '${MODEL}'
            - name: AI__Google__TimeoutSeconds
              value: '120'
            - name: AI__InternalApiKey
              valueFrom:
                secretKeyRef:
                  name: '${INTERNAL_KEY_SECRET}'
                  key: '${SECRET_VERSION}'
            - name: Logging__LogLevel__Default
              value: Information
            - name: Logging__LogLevel__Microsoft.AspNetCore
              value: Warning
          startupProbe:
            httpGet:
              path: /health
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
  traffic:
    - latestRevision: true
      percent: 100
