name: Deploy AI API

on:
  push:
    branches: [dev, main]
    paths:
      - 'src/AI/**'
      - 'src/Shared/StoryPlatform.Contracts/**'
      - 'tests/StoryPlatform.AI.*/**'
      - 'infra/google-cloud/**'
      - '.github/workflows/deploy-ai-api.yml'
  workflow_dispatch:
    inputs:
      promote_production:
        description: 'Deploy a production candidate, test it, then switch traffic (main only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-ai-api
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Deployment and authentication regression tests (offline mocks)
        run: python3 -m unittest discover -s infra/google-cloud/tests -p 'test_*.py' -v
      - name: AI unit tests
        run: dotnet test tests/StoryPlatform.AI.UnitTests/StoryPlatform.AI.UnitTests.csproj -c Release
      - name: AI integration tests (offline fixtures)
        run: dotnet test tests/StoryPlatform.AI.IntegrationTests/StoryPlatform.AI.IntegrationTests.csproj -c Release

  production:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.promote_production)
    needs: test
    runs-on: ubuntu-latest
    environment: ai-production
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: gen-lang-client-0675088605
      REGION: asia-southeast1
      SERVICE: taletale-ai-production
      RUNTIME: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      DEPLOYER: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      SECRET: ${{ vars.AI_INTERNAL_KEY_SECRET }}
      SECRET_VERSION: ${{ vars.AI_INTERNAL_KEY_SECRET_VERSION }}
      MODEL: ${{ vars.AI_TEXT_MODEL || 'gemini-3.8-flash' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate production configuration
        run: |
          test -n "$RUNTIME" && test -n "$DEPLOYER" && test -n "$WIF_PROVIDER"
          test -n "$SECRET" && [[ "$SECRET_VERSION" =~ ^[1-9][0-9]*$ ]]
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Require the bootstrapped private production service
        run: gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(metadata.name)'
      - uses: docker/setup-buildx-action@v3
      - name: Configure registry authentication
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - name: Build and push AI-only image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/AI/StoryPlatform.AI.Api/Dockerfile
          target: ai-api
          platforms: linux/amd64
          push: true
          tags: asia-southeast1-docker.pkg.dev/gen-lang-client-0675088605/taletale-ai/ai-api:${{ github.sha }}
      - name: Deploy production candidate without serving traffic
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: >-
          python infra/google-cloud/cloudrun.py deploy
          --project "$PROJECT_ID" --region "$REGION" --service "$SERVICE"
          --runtime "$RUNTIME" --model "$MODEL"
          --image "$REGION-docker.pkg.dev/$PROJECT_ID/taletale-ai/ai-api@$DIGEST"
          --secret "$SECRET" --secret-version "$SECRET_VERSION" --environment production
          --candidate-tag candidate --revision-suffix "gh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          --rollout-state "$RUNNER_TEMP/ai-rollout.json"
      - name: Resolve exact candidate and canonical audience
        id: candidate
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          state = json.loads((Path(os.environ['RUNNER_TEMP']) / 'ai-rollout.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"url={state['candidate_url']}\naudience={state['audience']}\n")
          PY
      - name: Generate candidate smoke ID token through WIF
        id: smoke-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}
          token_format: id_token
          id_token_audience: ${{ steps.candidate.outputs.audience }}
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false
      - name: Verify real Vertex connection and generation on candidate
        env:
          CANDIDATE_URL: ${{ steps.candidate.outputs.url }}
          AI_SMOKE_ID_TOKEN: ${{ steps.smoke-auth.outputs.id_token }}
        run: >-
          python infra/google-cloud/cloudrun.py verify-vertex --project "$PROJECT_ID"
          --url "$CANDIDATE_URL" --secret "$SECRET" --secret-version "$SECRET_VERSION"
          --identity-token-env AI_SMOKE_ID_TOKEN --expected-model "$MODEL"
          --rollout-state "$RUNNER_TEMP/ai-rollout.json"
      - name: Switch traffic to the verified revision
        run: >-
          python infra/google-cloud/cloudrun.py promote
          --project "$PROJECT_ID" --region "$REGION" --service "$SERVICE"
          --rollout-state "$RUNNER_TEMP/ai-rollout.json"
      - name: Save deployment and rollback information (no credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-rollout-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ai-rollout.json
          if-no-files-found: ignore
          retention-days: 14
